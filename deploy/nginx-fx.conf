# Accounts-Manager Flutter web — public static origin only.
# Deny secret-like filenames; SPA fallback for client routes.
# Entry/bootstrap JS must not be long-cached (iPhone Home Screen / Safari).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never serve hidden / server env files from document root
    # (must not fall through to SPA /index.html)
    location ~* /(^|/)\.env($|/) {
        deny all;
        return 404;
    }
    location = /.env {
        deny all;
        return 404;
    }
    location = /client.env {
        deny all;
        return 404;
    }
    location ~* /(^|/)(client\.env|\.env\.[A-Za-z0-9_.-]+)$ {
        deny all;
        return 404;
    }

    # Public Flutter config (JSON — not *.env)
    location = /assets/assets/config/client_config.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Flutter bootstrap / shell — always revalidate
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /flutter.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /manifest.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    # Hashed / static assets under /assets/
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Other static files (icons, canvaskit, etc.) — short cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|otf|wasm|json)$ {
        try_files $uri =404;
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    # Flutter SPA — only for navigations, not missing assets
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
